<form id="userForm">
    <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
    </div>

    <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
    </div>

    <div>
        <label for="firstName">Name</label>
        <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
    </div>

    <div>
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
    </div>

    <fieldset id="employed">
        <legend>Are you employed?</legend>

        <label>
            <input type="radio" name="isEmployee" id="employeeYes" value="yes">
            Yes
        </label>

        <label>
            <input type="radio" name="isEmployee" id="employeeNo" value="no" checked>
            No
        </label>
    </fieldset>

    <div id="employmentField" style="display: none;">
        <label for="employment">Job</label>
        <input type="text" id="employment" name="employment" autocomplete="organization-title">
    </div>

    <button type="submit">Submit</button>
</form>

<script>
    const form = document.getElementById('userForm');
    const employmentField = document.getElementById('employmentField');
    const radios = document.querySelectorAll('input[name="isEmployee"]');

    const enableEmploymentValues = () => {        
        const selectedValue = form.elements['isEmployee'].value;
        if (selectedValue === "yes") {
            employmentField.style.display = "block";
        }
        else {
            employmentField.style.display = "none";
        }
    }

    radios.forEach(radio => {
        radio.addEventListener("change", enableEmploymentValues);
    })

</script>
